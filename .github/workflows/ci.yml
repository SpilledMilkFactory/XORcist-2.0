  sanitizers-fuzz:
    name: Clang ASan/UBSan + property tests + libFuzzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build cmake
      - name: Configure instrumented core and libFuzzer
        run: |
          cmake -S . -B build-sanitized -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ -DXORCIST_BUILD_GUI=OFF \
            -DXORCIST_BUILD_TESTS=ON -DXORCIST_BUILD_FUZZER=ON \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -O1' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
      - name: Build
        run: cmake --build build-sanitized --parallel 2
      - name: Instrumented tests
        run: ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir build-sanitized --output-on-failure
      - name: Bounded coverage-guided fuzz exercise
        run: |
          mkdir -p /tmp/xorcist-fuzz-corpus
          cp tests/corpus/net/* /tmp/xorcist-fuzz-corpus/
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-sanitized/xorcist_fuzz_net /tmp/xorcist-fuzz-corpus -runs=3000 -max_len=512 -timeout=10

#  signed-candidates:
    name: Sign + verify M0 candidate artifacts (manual workflow only)
    needs: [linux, windows, sanitizers-fuzz]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xorcist-candidate-*
          path: candidates
          merge-multiple: true
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Create and verify Sigstore signing bundles
        shell: bash
        env:
          EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(candidates/*.tar.gz candidates/*.zip)
          if (( ${#candidates[@]} != 4 )); then
            echo "Expected 3 Linux archives and 1 Windows ZIP; found ${#candidates[@]}" >&2
            exit 1
          fi
          for artifact in "${candidates[@]}"; do
            cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact"
            cosign verify-blob "$artifact" --bundle "$artifact.sigstore.json" \
              --certificate-identity "$EXPECTED_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
      - uses: actions/upload-artifact@v4
        with:
          name: xorcist-m0-signed-candidates
          path: candidates/*
          if-no-files-found: error
