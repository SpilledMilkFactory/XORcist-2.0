name: M0 C++ qualification and signed candidates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux CLI+GUI+tests (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: debian12, image: 'debian:12' }
          - { id: debian13, image: 'debian:13' }
          - { id: ubuntu2604, image: 'ubuntu:26.04' }
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install toolchain, OpenGL, X11 build dependencies and headless display
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git g++ cmake ninja-build python3 libssl-dev \
            libgl1-mesa-dev libgl1-mesa-dri libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev \
            xvfb xauth
      - uses: actions/checkout@v4
      - name: Configure from a clean checkout (pinned Dear ImGui and GLFW)
        run: |
          cmake -S . -B build-m0 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DXORCIST_BUILD_GUI=ON -DXORCIST_BUILD_TESTS=ON \
            -DXORCIST_USE_SYSTEM_GLFW=OFF -DXORCIST_FETCH_GLFW=ON
      - name: Compile CLI and GUI
        run: cmake --build build-m0 --parallel 2
      - name: Run all tests including headless GUI initialization and frame rendering
        run: xvfb-run -a -s '-screen 0 1280x800x24' ctest --test-dir build-m0 --output-on-failure
      - name: CLI smoke test
        run: |
          test "$(./build-m0/xorcist net collapse 10.0.0.0/25 10.0.0.128/25)" = '10.0.0.0/24'
          test "$(./build-m0/xorcist xor text --text 'Hello!' --key-hex 010203)" = '49676f6d6d22'
      - name: Stage install and generate SPDX candidate archive
        run: |
          cmake --install build-m0 --prefix stage-m0
          python3 scripts/package_candidate.py --stage stage-m0 --output-dir dist \
            --platform '${{ matrix.id }}-amd64' --git-sha "$GITHUB_SHA" --format tar.gz
          cd dist && sha256sum -c *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: xorcist-candidate-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error

