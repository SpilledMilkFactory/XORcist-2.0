  sanitizers-fuzz:
    name: Clang ASan/UBSan + property tests + libFuzzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build cmake libssl-dev
      - name: Configure instrumented core and libFuzzer
        run: |
          cmake -S . -B build-sanitized -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ -DXORCIST_BUILD_GUI=OFF \
            -DXORCIST_BUILD_TESTS=ON -DXORCIST_BUILD_FUZZER=ON \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -O1' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
      - name: Build
        run: cmake --build build-sanitized --parallel 2
      - name: Instrumented tests
        run: ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir build-sanitized --output-on-failure
      - name: Bounded coverage-guided fuzz exercise
        run: |
          mkdir -p /tmp/xorcist-fuzz-corpus
          cp tests/corpus/net/* /tmp/xorcist-fuzz-corpus/
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-sanitized/xorcist_fuzz_net /tmp/xorcist-fuzz-corpus -runs=3000 -max_len=512 -timeout=10
          mkdir -p /tmp/xorcist-fuzz-data
          printf 'TWFu' > /tmp/xorcist-fuzz-data/base64.txt
          printf '00112233' > /tmp/xorcist-fuzz-data/hex.txt
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-sanitized/xorcist_fuzz_data /tmp/xorcist-fuzz-data -runs=3000 -max_len=512 -timeout=10
          mkdir -p /tmp/xorcist-fuzz-envelope
          python3 - <<'PY_ENVELOPE'
          from pathlib import Path
          p=Path('/tmp/xorcist-fuzz-envelope')/'valid-v1-header.bin'
          h=bytearray(64)
          h[:8]=b'XORC3AE1'; h[8:11]=b'\x01\x01\x01'
          h[12:16]=(32768).to_bytes(4,'big')
          h[16:20]=(8).to_bytes(4,'big')
          h[20:24]=(1).to_bytes(4,'big')
          p.write_bytes(h)
          PY_ENVELOPE
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-sanitized/xorcist_fuzz_envelope /tmp/xorcist-fuzz-envelope -runs=3000 -max_len=64 -timeout=10

# Signed release candidates remain deferred to M4. The previous draft used a
# disabled job key with active child keys; that was not valid standalone CI.
# Enable a separate signing job only after Linux/Windows distribution jobs,
# artifact counts, identities and cosign verification are qualified.
